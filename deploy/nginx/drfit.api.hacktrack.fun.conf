# /etc/nginx/sites-available/drfit.api.hacktrack.fun

upstream drfit_api {
    server 127.0.0.1:3010;
    keepalive 32;
}

limit_req_zone $binary_remote_addr zone=drfit_api_limit:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=drfit_auth_limit:10m rate=5r/s;

# HTTP -> HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name drfit.api.hacktrack.fun;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name drfit.api.hacktrack.fun;

    ssl_certificate /etc/letsencrypt/live/drfit.api.hacktrack.fun/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/drfit.api.hacktrack.fun/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/drfit.api.hacktrack.fun/chain.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL_drfit:10m;
    ssl_session_tickets off;
    ssl_stapling on;
    ssl_stapling_verify on;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;

    access_log /var/log/nginx/drfit.api.hacktrack.fun.access.log;
    error_log  /var/log/nginx/drfit.api.hacktrack.fun.error.log warn;

    client_max_body_size 5M;

    proxy_connect_timeout 60s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;

    # Static avatar / upload files served straight from disk (Docker bind mount).
    location /uploads/ {
        alias /home/deploy/drfit-app-be/uploads/;
        access_log off;
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
        try_files $uri =404;
    }

    # Stripe webhook needs raw body — disable buffering, no rate limit.
    location = /credits/webhook {
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_pass http://drfit_api;
    }

    # Auth endpoints — stricter rate limit.
    location /auth/ {
        limit_req zone=drfit_auth_limit burst=10 nodelay;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_pass http://drfit_api;
    }

    # Health check — no rate limit, no access log.
    location = /health {
        access_log off;
        proxy_pass http://drfit_api;
    }

    location / {
        limit_req zone=drfit_api_limit burst=20 nodelay;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_pass http://drfit_api;
        proxy_redirect off;
        proxy_buffering off;
    }

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript application/xml+rss image/svg+xml;
}
